# Render Blueprint for GrantAssist AI Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: grantassist-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grantassist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: grantassist-redis
          property: connectionString
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

databases:
  - name: grantassist-db
    plan: free
    databaseName: grantassist
    user: grantassist

  - name: grantassist-redis
    plan: free
